<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manual Route Editor</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f4f6f8;
      color: #102033;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    header {
      height: 54px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #ffffff;
      border-bottom: 1px solid #d8dee7;
      box-shadow: 0 1px 6px rgba(15, 23, 42, 0.08);
      z-index: 3;
    }
    button, select, label.file {
      height: 34px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #102033;
      padding: 0 10px;
      font-size: 13px;
      cursor: pointer;
    }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    button.danger { color: #b91c1c; border-color: #fecaca; }
    button.active { background: #0f172a; border-color: #0f172a; color: #fff; }
    button:disabled { opacity: 0.45; cursor: default; }
    input[type="file"] { display: none; }
    main { flex: 1; display: grid; grid-template-columns: minmax(560px, 1fr) 340px; min-height: 0; }
    .map-wrap { position: relative; overflow: hidden; background: #eef3f8; }
    canvas { width: 100%; height: 100%; display: block; }
    aside {
      border-left: 1px solid #d8dee7;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel { padding: 12px; border-bottom: 1px solid #e2e8f0; }
    .panel h2 { margin: 0 0 8px; font-size: 14px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12px; color: #475569; }
    .stats strong { display: block; color: #0f172a; font-size: 15px; }
    textarea {
      width: 100%;
      height: 190px;
      resize: vertical;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px;
      font: 12px/1.45 Consolas, "Courier New", monospace;
      white-space: pre;
    }
    .lines { overflow: auto; padding: 8px 12px 12px; }
    .line-card {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      background: #fff;
    }
    .line-card.active { border-color: #2563eb; box-shadow: inset 3px 0 0 #2563eb; }
    .line-title { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; }
    .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; }
    .station-list { margin-top: 6px; color: #475569; font-size: 12px; line-height: 1.45; word-break: break-word; }
    .station-pill {
      display: inline-flex;
      align-items: center;
      height: 24px;
      margin: 3px 3px 0 0;
      padding: 0 7px;
      border: 1px solid #dbe3ef;
      border-radius: 6px;
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      cursor: pointer;
    }
    .station-pill.selected {
      background: #dbeafe;
      border-color: #2563eb;
      color: #1d4ed8;
      font-weight: 700;
    }
    .status {
      position: absolute;
      left: 12px;
      bottom: 12px;
      max-width: min(620px, calc(100% - 24px));
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(203, 213, 225, 0.9);
      color: #334155;
      font-size: 12px;
      pointer-events: none;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; grid-template-rows: minmax(420px, 62vh) auto; }
      aside { border-left: 0; border-top: 1px solid #d8dee7; }
    }
  </style>
</head>
<body>
  <header>
    <select id="activeLine"></select>
    <button id="newLine" class="primary">New Line</button>
    <button id="appendMode" class="active">Append</button>
    <button id="insertMode">Insert After</button>
    <button id="insertBeforeMode">Insert Before</button>
    <button id="replaceMode">Replace</button>
    <button id="undo">Undo</button>
    <button id="removeStation" class="danger">Remove Station</button>
    <button id="moveUp">Move Up</button>
    <button id="moveDown">Move Down</button>
    <button id="deleteLine" class="danger">Delete Line</button>
    <button id="clearAll" class="danger">Clear</button>
    <label class="file">Import CSV<input id="csvFile" type="file" accept=".csv,text/csv" /></label>
    <button id="saveCsv" class="primary">Save CSV</button>
    <button id="copyCsv">Copy CSV</button>
    <button id="downloadCsv">Download CSV</button>
  </header>
  <main>
    <section class="map-wrap">
      <canvas id="map"></canvas>
      <div id="status" class="status"></div>
    </section>
    <aside>
      <section class="panel">
        <h2>Manual route</h2>
        <div class="stats">
          <div><strong id="stationCount">0</strong>候选站</div>
          <div><strong id="lineCount">0</strong>线路</div>
          <div><strong id="selectedCount">0</strong>已选站</div>
          <div><strong id="edgeCount">0</strong>连边</div>
        </div>
      </section>
      <section class="panel">
        <h2>CSV</h2>
        <textarea id="csvOut" spellcheck="false"></textarea>
      </section>
      <section id="lineList" class="lines"></section>
    </aside>
  </main>

  <script>
    const stationUrl = "output/01_candidate_stations_table.csv";
    const routeUrl = "manual_intuition_route.csv";
    const colors = ["#dc2626", "#2563eb", "#16a34a", "#9333ea", "#f97316", "#0891b2", "#be123c", "#4f46e5"];
    const canvas = document.getElementById("map");
    const ctx = canvas.getContext("2d");
    const state = {
      stations: [],
      lines: [],
      activeLineId: "L1",
      selectedStationPos: null,
      editMode: "append",
      hoverStation: null,
      bounds: null,
      dpr: 1,
    };

    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], next = text[i + 1];
        if (quoted) {
          if (ch === '"' && next === '"') { cell += '"'; i++; }
          else if (ch === '"') quoted = false;
          else cell += ch;
        } else if (ch === '"') quoted = true;
        else if (ch === ",") { row.push(cell); cell = ""; }
        else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
        else if (ch !== "\r") cell += ch;
      }
      if (cell.length || row.length) { row.push(cell); rows.push(row); }
      if (!rows.length) return [];
      const headers = rows.shift().map(s => s.trim());
      return rows
        .filter(r => r.some(v => String(v).trim()))
        .map(r => Object.fromEntries(headers.map((h, i) => [h, r[i] ?? ""])));
    }

    function csvEscape(value) {
      const text = String(value ?? "");
      return /[",\n\r]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
    }

    function toRouteCsv() {
      const rows = ["line_id,order,station_id,note"];
      for (const line of state.lines) {
        line.stations.forEach((stationId, idx) => {
          rows.push([line.id, idx + 1, stationId, ""].map(csvEscape).join(","));
        });
      }
      return rows.join("\n") + "\n";
    }

    function ensureLine(id = state.activeLineId) {
      let line = state.lines.find(item => item.id === id);
      if (!line) {
        line = { id, color: colors[state.lines.length % colors.length], stations: [] };
        state.lines.push(line);
      }
      return line;
    }

    function activeLine() {
      return ensureLine(state.activeLineId);
    }

    function clampSelectedPos() {
      const line = activeLine();
      if (state.selectedStationPos === null) return;
      if (line.stations.length === 0) {
        state.selectedStationPos = null;
        return;
      }
      state.selectedStationPos = Math.max(0, Math.min(state.selectedStationPos, line.stations.length - 1));
    }

    function nextLineId() {
      let n = 1;
      while (state.lines.some(line => line.id === `L${n}`)) n++;
      return `L${n}`;
    }

    function stationById(id) {
      return state.stations.find(station => station.station_id === id);
    }

    function loadStations(rows) {
      state.stations = rows.map(row => ({
        station_id: row.station_id,
        lon: Number(row.lon),
        lat: Number(row.lat),
        total_value: Number(row.total_value || 0),
        name: row.name || "",
        layers: row.layers || "",
      })).filter(station => station.station_id && Number.isFinite(station.lon) && Number.isFinite(station.lat));
      const padLon = 0.006, padLat = 0.006;
      state.bounds = {
        west: Math.min(...state.stations.map(s => s.lon)) - padLon,
        east: Math.max(...state.stations.map(s => s.lon)) + padLon,
        south: Math.min(...state.stations.map(s => s.lat)) - padLat,
        north: Math.max(...state.stations.map(s => s.lat)) + padLat,
      };
    }

    function loadRoute(rows) {
      const grouped = new Map();
      for (const row of rows) {
        const lineId = String(row.line_id || "L1").trim();
        const stationId = String(row.station_id || "").trim();
        if (!lineId || !stationId) continue;
        const order = Number(row.order || 0);
        if (!grouped.has(lineId)) grouped.set(lineId, []);
        grouped.get(lineId).push({ order, stationId });
      }
      state.lines = [...grouped.entries()].map(([id, items], idx) => ({
        id,
        color: colors[idx % colors.length],
        stations: items.sort((a, b) => a.order - b.order).map(item => item.stationId).filter(id => stationById(id)),
      })).filter(line => line.stations.length);
      if (!state.lines.length) state.lines = [{ id: "L1", color: colors[0], stations: [] }];
      state.activeLineId = state.lines[0].id;
      state.selectedStationPos = null;
    }

    function project(station) {
      const { west, east, south, north } = state.bounds;
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const pad = 42;
      return {
        x: pad + (station.lon - west) / Math.max(east - west, 1e-9) * (w - 2 * pad),
        y: h - pad - (station.lat - south) / Math.max(north - south, 1e-9) * (h - 2 * pad),
      };
    }

    function stationRadius(station) {
      const maxValue = Math.max(...state.stations.map(s => s.total_value), 1);
      return 5 + 11 * Math.sqrt(station.total_value / maxValue);
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      state.dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * state.dpr));
      canvas.height = Math.max(1, Math.round(rect.height * state.dpr));
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      draw();
    }

    function drawBackground(w, h) {
      ctx.fillStyle = "#eef3f8";
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "rgba(148, 163, 184, 0.22)";
      ctx.lineWidth = 1;
      for (let x = 30; x < w; x += 54) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 80, h); ctx.stroke();
      }
      for (let y = 28; y < h; y += 46) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y - 30); ctx.stroke();
      }
      ctx.strokeStyle = "rgba(100, 116, 139, 0.34)";
      ctx.lineWidth = 5;
      for (let i = 0; i < 7; i++) {
        const y = h * (0.15 + i * 0.12);
        ctx.beginPath();
        ctx.moveTo(-40, y);
        ctx.bezierCurveTo(w * 0.25, y + 60 * Math.sin(i), w * 0.58, y - 42 * Math.cos(i), w + 40, y + 20);
        ctx.stroke();
      }
    }

    function draw() {
      if (!state.bounds) return;
      const w = canvas.clientWidth, h = canvas.clientHeight;
      drawBackground(w, h);

      for (const line of state.lines) {
        ctx.strokeStyle = line.color;
        ctx.lineWidth = line.id === state.activeLineId ? 5.5 : 4;
        ctx.globalAlpha = line.id === state.activeLineId ? 0.92 : 0.58;
        ctx.beginPath();
        line.stations.forEach((id, idx) => {
          const station = stationById(id);
          if (!station) return;
          const p = project(station);
          if (idx === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      const selectedIds = new Set(state.lines.flatMap(line => line.stations));
      for (const station of state.stations) {
        const p = project(station);
        const selected = selectedIds.has(station.station_id);
        const hover = state.hoverStation === station.station_id;
        const r = selected || hover ? stationRadius(station) : Math.max(4, stationRadius(station) * 0.58);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = selected ? "#2563eb" : "#38bdf8";
        if (station.layers.includes("transport")) ctx.fillStyle = selected ? "#7c3aed" : "#a78bfa";
        ctx.fill();
        ctx.lineWidth = hover ? 4 : 2;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
        ctx.fillStyle = "#0f172a";
        ctx.font = hover || selected ? "bold 12px Arial" : "bold 11px Arial";
        ctx.fillText(station.station_id, p.x + r + 4, p.y - r - 2);
      }
    }

    function nearestStation(evt) {
      const rect = canvas.getBoundingClientRect();
      const mx = evt.clientX - rect.left, my = evt.clientY - rect.top;
      let best = null;
      for (const station of state.stations) {
        const p = project(station);
        const d = Math.hypot(mx - p.x, my - p.y);
        const hit = Math.max(14, stationRadius(station) + 4);
        if (d <= hit && (!best || d < best.d)) best = { station, d };
      }
      return best?.station || null;
    }

    function addStation(stationId) {
      const line = activeLine();
      if (state.editMode === "replace" && state.selectedStationPos !== null && line.stations.length) {
        line.stations[state.selectedStationPos] = stationId;
      } else if (state.editMode === "insertBefore" && state.selectedStationPos !== null) {
        line.stations.splice(state.selectedStationPos, 0, stationId);
      } else if (state.editMode === "insertAfter" && state.selectedStationPos !== null) {
        line.stations.splice(state.selectedStationPos + 1, 0, stationId);
        state.selectedStationPos += 1;
      } else {
        line.stations.push(stationId);
        state.selectedStationPos = line.stations.length - 1;
      }
      renderUi();
    }

    function setMode(mode) {
      state.editMode = mode;
      renderUi();
    }

    function renderUi() {
      const active = document.getElementById("activeLine");
      active.innerHTML = "";
      for (const line of state.lines) {
        const option = document.createElement("option");
        option.value = line.id;
        option.textContent = line.id;
        active.appendChild(option);
      }
      active.value = state.activeLineId;
      clampSelectedPos();
      for (const [id, mode] of [["appendMode", "append"], ["insertMode", "insertAfter"], ["insertBeforeMode", "insertBefore"], ["replaceMode", "replace"]]) {
        document.getElementById(id).classList.toggle("active", state.editMode === mode);
      }
      const hasSelection = state.selectedStationPos !== null && activeLine().stations.length > 0;
      document.getElementById("removeStation").disabled = !hasSelection;
      document.getElementById("moveUp").disabled = !hasSelection || state.selectedStationPos === 0;
      document.getElementById("moveDown").disabled = !hasSelection || state.selectedStationPos >= activeLine().stations.length - 1;
      const selectedIds = new Set(state.lines.flatMap(line => line.stations));
      document.getElementById("stationCount").textContent = state.stations.length;
      document.getElementById("lineCount").textContent = state.lines.length;
      document.getElementById("selectedCount").textContent = selectedIds.size;
      document.getElementById("edgeCount").textContent = state.lines.reduce((n, line) => n + Math.max(0, line.stations.length - 1), 0);
      document.getElementById("csvOut").value = toRouteCsv();
      document.getElementById("status").textContent = state.hoverStation
        ? `${state.hoverStation} ${stationById(state.hoverStation)?.name || ""}`
        : `Active ${state.activeLineId}; mode ${state.editMode}; selected ${hasSelection ? activeLine().stations[state.selectedStationPos] : "none"}`;
      const list = document.getElementById("lineList");
      list.innerHTML = "";
      for (const line of state.lines) {
        const card = document.createElement("div");
        card.className = "line-card" + (line.id === state.activeLineId ? " active" : "");
        card.onclick = () => {
          state.activeLineId = line.id;
          state.selectedStationPos = line.stations.length ? Math.min(state.selectedStationPos ?? 0, line.stations.length - 1) : null;
          renderUi();
        };
        const title = document.createElement("div");
        title.className = "line-title";
        title.innerHTML = `<span><span class="swatch" style="background:${line.color}"></span>${line.id}</span><span>${line.stations.length}</span>`;
        const stationList = document.createElement("div");
        stationList.className = "station-list";
        if (!line.stations.length) {
          stationList.textContent = "(empty)";
        } else {
          line.stations.forEach((stationId, idx) => {
            const pill = document.createElement("button");
            pill.type = "button";
            pill.className = "station-pill" + (line.id === state.activeLineId && idx === state.selectedStationPos ? " selected" : "");
            pill.textContent = `${idx + 1}. ${stationId}`;
            pill.onclick = evt => {
              evt.stopPropagation();
              state.activeLineId = line.id;
              state.selectedStationPos = idx;
              renderUi();
            };
            stationList.appendChild(pill);
          });
        }
        card.append(title, stationList);
        list.appendChild(card);
      }
      draw();
    }

    async function loadText(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`${url}: ${res.status}`);
      return await res.text();
    }

    async function init() {
      try {
        loadStations(parseCsv(await loadText(stationUrl)));
      } catch (err) {
        document.getElementById("status").textContent = `Cannot load ${stationUrl}. Serve this folder with a local HTTP server.`;
        throw err;
      }
      try {
        loadRoute(parseCsv(await loadText(routeUrl)));
      } catch {
        state.lines = [{ id: "L1", color: colors[0], stations: [] }];
      }
      resize();
      renderUi();
    }

    canvas.addEventListener("mousemove", evt => {
      const station = nearestStation(evt);
      const id = station?.station_id || null;
      if (id !== state.hoverStation) {
        state.hoverStation = id;
        renderUi();
      }
    });
    canvas.addEventListener("click", evt => {
      const station = nearestStation(evt);
      if (station) addStation(station.station_id);
    });
    document.getElementById("activeLine").onchange = evt => { state.activeLineId = evt.target.value; renderUi(); };
    document.getElementById("appendMode").onclick = () => setMode("append");
    document.getElementById("insertMode").onclick = () => setMode("insertAfter");
    document.getElementById("insertBeforeMode").onclick = () => setMode("insertBefore");
    document.getElementById("replaceMode").onclick = () => setMode("replace");
    document.getElementById("newLine").onclick = () => {
      const id = nextLineId();
      state.lines.push({ id, color: colors[state.lines.length % colors.length], stations: [] });
      state.activeLineId = id;
      state.selectedStationPos = null;
      renderUi();
    };
    document.getElementById("undo").onclick = () => {
      const line = activeLine();
      line.stations.pop();
      clampSelectedPos();
      renderUi();
    };
    document.getElementById("removeStation").onclick = () => {
      const line = activeLine();
      if (state.selectedStationPos === null) return;
      line.stations.splice(state.selectedStationPos, 1);
      clampSelectedPos();
      renderUi();
    };
    document.getElementById("moveUp").onclick = () => {
      const line = activeLine();
      const i = state.selectedStationPos;
      if (i === null || i <= 0) return;
      [line.stations[i - 1], line.stations[i]] = [line.stations[i], line.stations[i - 1]];
      state.selectedStationPos = i - 1;
      renderUi();
    };
    document.getElementById("moveDown").onclick = () => {
      const line = activeLine();
      const i = state.selectedStationPos;
      if (i === null || i >= line.stations.length - 1) return;
      [line.stations[i + 1], line.stations[i]] = [line.stations[i], line.stations[i + 1]];
      state.selectedStationPos = i + 1;
      renderUi();
    };
    document.getElementById("deleteLine").onclick = () => {
      if (state.lines.length <= 1) { state.lines[0].stations = []; renderUi(); return; }
      state.lines = state.lines.filter(line => line.id !== state.activeLineId);
      state.activeLineId = state.lines[0].id;
      state.selectedStationPos = null;
      renderUi();
    };
    document.getElementById("clearAll").onclick = () => {
      state.lines = [{ id: "L1", color: colors[0], stations: [] }];
      state.activeLineId = "L1";
      renderUi();
    };
    document.getElementById("copyCsv").onclick = async () => navigator.clipboard.writeText(toRouteCsv());
    document.getElementById("saveCsv").onclick = async () => {
      const res = await fetch("/api/manual-route", {
        method: "POST",
        headers: { "Content-Type": "text/csv;charset=utf-8" },
        body: toRouteCsv(),
      });
      document.getElementById("status").textContent = res.ok
        ? "Saved manual_intuition_route.csv"
        : "Save failed; use Copy CSV or Download CSV";
    };
    document.getElementById("downloadCsv").onclick = () => {
      const blob = new Blob([toRouteCsv()], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "manual_intuition_route.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    };
    document.getElementById("csvFile").onchange = async evt => {
      const file = evt.target.files[0];
      if (!file) return;
      loadRoute(parseCsv(await file.text()));
      renderUi();
    };
    window.addEventListener("resize", resize);
    init();
  </script>
</body>
</html>
